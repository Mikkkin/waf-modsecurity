---
# Режим по умолчанию, а не cloud: только он умеет читать audit-лог и проверять,
# какое именно правило сработало. На живом стенде так нельзя - журнал лежит
# на другой машине, поэтому там остается ftw.yaml с режимом cloud.
logfile: '/var/log/modsec/audit.log'

testoverride:
  input:
    dest_addr: '127.0.0.1'
    port: 80
    protocol: 'http'
