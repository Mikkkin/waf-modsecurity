SecRule REQUEST_COOKIES|REQUEST_COOKIES_NAMES|ARGS_NAMES|ARGS "@rx (?i)\b(?:glob|regexp|match)\b\s*(?:['\x22\x60]|[a-z_]{2,}\s*\()|\bcollate\s+(?:nocase|binary|rtrim)\b" \
    "id:12001,\
     phase:2,\
     block,\
     capture,\
     t:none,t:urlDecodeUni,t:replaceComments,\
     msg:'SQLite-specific comparison operator or collation in argument (GLOB/REGEXP/MATCH/COLLATE)',\
     logdata:'Matched Data: %{TX.0} found within %{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
     tag:'application-multi',\
     tag:'language-multi',\
     tag:'platform-sqlite',\
     tag:'attack-sqli',\
     tag:'paranoia-level/1',\
     tag:'LAB/VIRTUAL-HARDENING',\
     ver:'LAB/1.0',\
     severity:'CRITICAL',\
     setvar:'tx.sql_injection_score=+%{tx.critical_anomaly_score}',\
     setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"
