SecRule REQUEST_URI_RAW "@rx (?i)%(?:25)*00" \
    "id:20001,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     t:none,\
     msg:'VP1: Poison Null Byte in request URI',\
     logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}',\
     tag:'application-multi',\
     tag:'attack-protocol',\
     tag:'LAB/VIRTUAL-PATCH',\
     ver:'LAB/1.0',\
     severity:'CRITICAL'"

SecRule REQUEST_METHOD "@streq POST" \
    "id:20002,\
     phase:2,\
     deny,\
     status:403,\
     log,\
     t:none,\
     msg:'VP2: Mass assignment - privileged field in POST /api/Users',\
     logdata:'Matched Data: %{MATCHED_VAR_NAME}',\
     tag:'application-multi',\
     tag:'attack-generic',\
     tag:'LAB/VIRTUAL-PATCH',\
     ver:'LAB/1.0',\
     severity:'CRITICAL',\
     chain"
    SecRule REQUEST_URI "@beginsWith /api/Users" "t:none,chain"
    SecRule ARGS_NAMES "@rx (?i)(?:^|\.)(?:role|isadmin|deluxetoken)$" "t:none"

SecRule REQUEST_URI "@beginsWith /rest/user/change-password" \
    "id:20003,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     t:none,\
     msg:'VP3: change-password without current password parameter',\
     logdata:'Matched Data: %{REQUEST_URI}',\
     tag:'application-multi',\
     tag:'attack-generic',\
     tag:'LAB/VIRTUAL-PATCH',\
     ver:'LAB/1.0',\
     severity:'CRITICAL',\
     chain"
    SecRule &ARGS:current "@eq 0" "t:none"
