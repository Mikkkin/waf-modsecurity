map $http_upgrade $lab_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream juiceshop {
    server 192.168.130.20:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name waf.lab _;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    client_max_body_size 12m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    access_log /var/log/nginx/waf-access.log;
    error_log  /var/log/nginx/waf-error.log warn;

    location / {
        proxy_pass http://juiceshop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $lab_connection_upgrade;
        proxy_buffering off;
    }
}
