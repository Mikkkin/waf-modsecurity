name: WAF regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_FTW_VERSION: '2.5.0'

jobs:
  waf:
    name: nginx + ModSecurity + CRS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Развернуть WAF
        run: sudo ./deploy.sh --origin 127.0.0.1:3000 --mode On

      - name: Версии для сводки
        run: |
          nginx -v 2>&1 | tee /tmp/versions.txt
          dpkg-query -W -f='ModSecurity v${Version}\n' libmodsecurity3t64 >> /tmp/versions.txt

      - name: Заглушка вместо приложения
        run: |
          sudo cp ci/stub-origin.conf /etc/nginx/sites-enabled/stub-origin.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Заголовок Host обязателен: по числовому адресу срабатывает 920350
      # "Host header is a numeric IP address", и дымовой запрос набирает 8 баллов
      # вместо 5, а само правило потом торчит в статистике прогона.
      - name: Дым
        run: |
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: waf.lab' http://127.0.0.1/)" = "200" ] && break
            sleep 1
          done
          curl -sS -o /dev/null -w 'обычный запрос: %{http_code}\n' -H 'Host: waf.lab' \
            'http://127.0.0.1/rest/products/search?q=apple'
          curl -sS -o /dev/null -w 'инъекция:       %{http_code}\n' -H 'Host: waf.lab' \
            'http://127.0.0.1/rest/products/search?q=%27%29%29--'

      # go-ftw в режиме по умолчанию читает audit-лог, чтобы проверить, какое
      # правило сработало. nginx кладет его с правами 0640 www-data:adm,
      # а сборка работает не от www-data.
      - name: Дать доступ к журналу
        run: |
          sudo chmod 755 /var/log/modsec
          sudo chmod a+r /var/log/modsec/audit.log
          ls -l /var/log/modsec/audit.log

      - name: go-ftw ${{ env.GO_FTW_VERSION }}
        run: |
          curl -fsSL "https://github.com/coreruleset/go-ftw/releases/download/v${GO_FTW_VERSION}/ftw_${GO_FTW_VERSION}_linux_amd64.tar.gz" \
            | tar -xzf - ftw
          sudo install -m0755 ftw /usr/local/bin/ftw
          ftw --version

      - name: Разбор тестов
        run: |
          set -o pipefail
          ftw check -d tests/regression 2>&1 | tee /tmp/check.log
          if grep -q 'WRN' /tmp/check.log; then
            echo "какой-то файл тестов не разобрался" >&2
            exit 1
          fi

      - name: Регрессия
        run: |
          set -o pipefail
          ftw run -d tests/regression --config tests/ftw-ci.yaml 2>&1 | tee /tmp/run.log
          expected=$(grep -c '^  - test_id:' tests/regression/*.yaml | awk -F: '{s+=$2} END {print s}')
          grep -qE "run ${expected} total tests" /tmp/run.log || {
            echo "ожидалось ${expected} тестов, выполнено меньше" >&2
            exit 1
          }

      - name: Сводка
        if: always()
        run: |
          {
            echo "## Регрессия WAF"
            echo
            echo "Среда сборки (не стенд: там Ubuntu 26.04 с более свежими пакетами):"
            grep -oE 'ModSecurity v[0-9.]+|nginx/[0-9.]+' /tmp/versions.txt 2>/dev/null | sort -u | sed 's/^/- /' || true
            echo "- OWASP CRS $(sed -n 's/.*ver:.OWASP_CRS\/\([0-9.]*\).*/\1/p' /etc/crs4/rules/REQUEST-949-BLOCKING-EVALUATION.conf | head -1)"
            echo
            echo "| Набор тестов | Пройдено |"
            echo "|---|---|"
            awk '/executing tests in file/ { f=$NF; next }
                 /passed/ && f { p[f]++ }
                 END { for (k in p) printf "| %s | %d |\n", k, p[k] }' /tmp/run.log | sort
            echo
            echo "**Итого: $(grep -oE 'run [0-9]+ total tests' /tmp/run.log | grep -oE '[0-9]+' | head -1) тестов, все зеленые.**"
            echo
            echo "Проверяется не только код ответа, но и идентификатор сработавшего правила."
            echo
            echo "### Правила, сработавшие за прогон"
            echo
            echo '```'
            sudo grep -ao '{"transaction".*}' /var/log/modsec/audit.log 2>/dev/null \
              | jq -rR 'fromjson? // empty
                  | .transaction
                  | select((.request.headers.Host // "") == "waf.lab")
                  | .messages[]?.details.ruleId' \
              | sort | uniq -c | sort -rn | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Если регрессия упала, первым делом надо знать, какие правила реально
      # сработали. Иначе гадать по коду ответа.
      - name: Что сработало в журнале
        if: failure()
        run: |
          sudo grep -ao '{"transaction".*}' /var/log/modsec/audit.log \
            | jq -rR 'fromjson? // empty
                | .transaction
                | select((.messages // []) | length > 0)
                | [.request.uri, ([.messages[].details.ruleId] | join(","))]
                | @tsv' | tail -60

      - name: Открыть логи для выгрузки
        if: always()
        run: sudo chmod -R a+rX /var/log/modsec /var/log/nginx || true

      - name: Забрать audit-лог
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: modsec-audit-log
          path: |
            /var/log/modsec/audit.log
            /var/log/nginx/waf-error.log
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Линтеры
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: shellcheck
        run: shellcheck -x -e SC2016 -P traffic traffic/*.sh analysis/*.sh deploy.sh

      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d relaxed tests .github
